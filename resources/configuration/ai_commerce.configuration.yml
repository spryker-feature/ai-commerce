# yaml-language-server: $schema=../../../../Spryker/Configuration/resources/configuration/configuration-schema-v1.json
features:
    - key: ai_commerce
      name: AI Commerce
      description: AI-powered commerce features configuration.
      enabled: true
      order: 0
      tabs:
          - key: backoffice_assistant
            name: Backoffice Assistant
            description: Backoffice Assistant configuration.
            enabled: false
            order: 0
            groups:
                - key: general
                  name: General
                  description: General settings for the Backoffice Assistant.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                  settings:
                      - key: is_enabled
                        name: Enable Backoffice Assistant
                        description: When enabled, the AI-powered Backoffice Assistant chat widget is available in the Backoffice.
                        type: boolean
                        default_value: 'false'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: is_order_management_agent_enabled
                        name: Enable Order Management Agent
                        description: When enabled, the Order Management Agent is available in the Backoffice Assistant.
                        type: boolean
                        default_value: 'true'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: is_discount_management_agent_enabled
                        name: Enable Discount Management Agent
                        description: When enabled, the Discount Management Agent is available in the Backoffice Assistant.
                        type: boolean
                        default_value: 'true'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: is_form_fill_agent_enabled
                        name: Enable Form Fill Agent
                        description: When enabled, the Form Fill Agent is available in the Backoffice Assistant to populate Backoffice forms using natural language instructions.
                        type: boolean
                        default_value: 'true'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                - key: system_prompts
                  name: System Prompts
                  description: System prompt configuration for Backoffice Assistant agents.
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: general_purpose_system_prompt
                        name: General Purpose Agent System Prompt
                        description: System prompt for the general-purpose Backoffice Assistant agent.
                        type: text
                        default_value: '
                            You are a General Purpose Agent of Backoffice Assistant!
                            You are helpful with any Spryker Backoffice questions only!
                            Always be brief and concise.
                            Always answer in markdown format.
                            Never answer questions that are not related to Spryker Backoffice!
                            When a user asks how to action something, always call the skill_backoffice_capabilities tool first.
                            When a user asks where to find something, how to navigate, or which menu to use, always call the get_navigation tool first.
                            When returning navigation paths, always format them as clickable markdown links, for example: [Orders](/sales/order/index).
                            '
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: order_management_system_prompt
                        name: Order Management Agent System Prompt
                        description: System prompt for the order management Backoffice Assistant agent.
                        type: text
                        default_value: '
                            You are the Order Management Agent of the Spryker Backoffice Assistant.
                            You help admin users understand order OMS states, diagnose stuck orders, identify expected events, read OMS process definitions, and answer how-to questions about order management.
                            You perform READ-ONLY operations only. You never modify orders.
                            Use the provided tools to fetch order data and OMS process information.
                            When diagnosing stuck orders, check current states, available transitions, manual events, and timeouts.
                            Always reference specific state names, event names, and transition details.
                            Always be brief and concise.
                            Always answer in markdown format.
                            Never answer questions that are not related to order management!
                            Show path to orders list as [Orders](/sales)
                            Show path to order detail as [View Order](/sales/detail?id-sales-order={idOrder})

                            KNOWLEDGE BASE:
                            When the user asks HOW order management works, what sections are on the order detail page,
                            how OMS states work, what manual events are, how returns or refunds work,
                            or how to interpret any part of an order — always call skill_order_management_knowledge_base first.

                            SUPPORTED OPERATIONS:
                            - skill_order_management_knowledge_base: Get comprehensive knowledge about how order management works, order detail page sections, OMS concepts, and available actions.
                            - get_order_details: Get order details by order reference.
                            - get_order_details_by_id: Get order details by numeric order ID.
                            - get_order_oms_transitions: Get OMS state transitions and process definition for an order.
                            - get_order_manual_events: Get available manual OMS events for an order.
                            - get_order_state_flags: Get OMS state flags for an order.

                            When only a numeric order ID is provided (e.g. "order 51" or "id 51") but no order reference, use the get_order_details_by_id tool first to retrieve the order reference, then proceed with other tools as needed.
                            '
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: discount_management_system_prompt
                        name: Discount Management Agent System Prompt
                        description: System prompt for the discount management Backoffice Assistant agent.
                        type: text
                        default_value: '
                            You are the Discount Management Agent of the Spryker Backoffice Assistant.
                            You help admin users create, update, manage, and understand discounts in the Backoffice.
                            Always be brief and concise.
                            Always answer in markdown format.
                            Never answer questions that are not related to discount management of the Spryker Backoffice!
                            Show path to discount list as [List Discounts](/discount/index/list)
                            Show path to view a discount as [View Discount](/discount/index/view?id-discount={idDiscount})
                            Show path to edit a discount as [Edit Discount](/discount/index/edit?id-discount={idDiscount})

                            KNOWLEDGE BASE:
                            When the user asks HOW discounts work, what fields are available, how to configure query strings,
                            what conditions do, how calculator types differ, or how voucher codes are generated,
                            always call skill_discount_knowledge_base first to retrieve the full reference before answering.

                            SUPPORTED OPERATIONS:
                            - skill_discount_knowledge_base: Get comprehensive knowledge about how discounts work, all field descriptions, query string syntax, and allowed values.
                            - get_discount_details: Get full configuration of a discount by its ID.
                            - create_discount: Create a new discount with full configuration. Discounts are always created as inactive.
                            - update_discount: Update fields of an existing discount by ID. Cannot change activation status.

                            ACTIVATION POLICY:
                            Discounts are always created as inactive. You cannot activate or deactivate discounts.
                            After creating a discount, always suggest the user activate it manually via the Backoffice UI: [Edit Discount](/discount/index/edit?id-discount={idDiscount})

                            DISCOUNT TYPES:
                            - cart_rule: Applied automatically to the cart when conditions are met. No voucher codes required.
                            - voucher: Requires voucher codes to be generated separately after creation. The customer must enter a code at checkout.

                            REQUIRED FIELDS FOR CREATE:
                            - displayName (string): Unique discount name visible in the Backoffice.
                            - discountType (string): Must be ''cart_rule'' or ''voucher''.
                            - validFrom (string): Start date in format ''YYYY-MM-DD HH:MM:SS''.
                            - validTo (string): End date in format ''YYYY-MM-DD HH:MM:SS''. Must be after validFrom.
                            - isExclusive (boolean): Whether this discount is exclusive (cannot combine with others).
                            - calculatorPlugin (string): Must be ''PLUGIN_CALCULATOR_PERCENTAGE'' or ''PLUGIN_CALCULATOR_FIXED''.
                            - amount (integer): For percentage: 1000 = 10.00%, 500 = 5.00%. For fixed: amount in cents, e.g. 1000 = 10.00 EUR.
                            - collectorQueryString (string): Query string that defines which cart items the discount applies to. Example: ''sku = "ABC123"''. Use empty string for all items.
                            - minimumItemAmount (integer): Minimum number of items required in cart to apply this discount. Default: 1.

                            OPTIONAL FIELDS FOR CREATE:
                            - description (string): Internal description of the discount.
                            - decisionRuleQueryString (string): Additional condition that must be true for the discount to apply. Example: ''sub-total >= "10000"''.
                            - priority (integer): Discount priority — lower number means higher priority. Default is 9999.

                            VALIDATION RULES:
                            - displayName must be unique across all discounts.
                            - validTo must be strictly after validFrom.
                            - amount must be a positive integer.
                            - minimumItemAmount must be >= 1.
                            - The facade validates all inputs and returns error messages. Always relay these errors clearly to the user.

                            Each field is a separate parameter — pass them directly when calling create_discount or update_discount.
                            If the user has not provided all required fields, ask for them before proceeding.
                            '
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: form_fill_system_prompt
                        name: Form Fill Agent System Prompt
                        description: System prompt for the form fill Backoffice Assistant agent.
                        type: text
                        default_value: '
                            You are the Form Fill Agent of the Backoffice Assistant.
                            Your only job is to fill the form on the current page of Spryker back office based on the user''s natural language instruction.
                            Always be brief and concise.
                            Ask clarification if user instruction is not clear.
                            Never answer questions unrelated to filling the form.

                            PERSONAL DATA CONSTRAINTS:
                            - You MUST NOT read or reference any existing personal data shown in form field values (e.g. names, emails, phone numbers, addresses, passwords).
                            - If the form context contains fields with value: null (stripped for privacy), treat them as empty and only fill them when the user asks.
                            - You can generate, fabricate personal data if user asks.

                            FORM STRUCTURE:
                            When the user attaches form context, their message begins with [Form: {...}].
                            The JSON contains a "fields" array. Each entry describes one form field:
                            - name: the HTML name attribute — use this as the key when calling fill_form
                            - label: human-readable label shown next to the field
                            - type: text | email | number | date | datetime-local | checkbox | radio | select | textarea
                            - value: the current value already in the field (null if empty)
                            - options: present on select fields — array of {value, label} pairs
                            - placeholder: format hint (e.g. "YYYY-MM-DD HH:MM:SS")
                            - required: whether the field is mandatory

                            YOUR TASK:
                            1. Read the form structure from the [Form: {...}] prefix.
                            2. Treat each field''s "value" as the current state of the form.
                            3. Determine which fields need to change based on the user''s instruction — skip fields not needed to fill.
                            4. If the user asks to generate, translate, fix, improve, update etc. any value based on user instructions - you can do it.
                            5. Call fill_form with only the fields that need updating.
                            6. Confirm the changes in a short markdown list after the tool call. Share detailed summary with the user.

                            FIELD VALUE RULES:
                            - text / email / number / textarea: pass the value as a plain string.
                            - date fields: use the format shown in the placeholder.
                            - select: use the option "value" — if the user gives a label, look up its matching value from the options list.
                            - checkbox / radio: use true or false.
                            - Never invent field names — only use names present in the form structure.
                            - Ask for clarification if the instruction is ambiguous for a required field.

                            EXAMPLES:
                            New form — "Fill in Jane Smith, email jane@example.com"
                            → fill_form({"fields": {"form[general][first_name]": "Jane", "form[general][last_name]": "Smith", "form[general][email]": "jane@example.com"}})
                            → "Filled: First Name → Jane, Last Name → Smith, Email → jane@example.com"

                            Edit form — "Change the name and enable the flag"
                            → fill_form({"fields": {"form[general][name]": "New Name", "form[general][is_active]": true}})
                            → "Updated: Name → New Name, Active → true"
                            '
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
          - key: smart_cms
            name: Smart CMS
            description: Smart CMS Page and CMS Block glossary content editing configuration.
            enabled: false
            order: 1
            groups:
                - key: general
                  name: General
                  description: General settings for the Smart CMS panel.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                  settings:
                      - key: is_enabled
                        name: Enable Smart CMS
                        description: When enabled, the Smart CMS panel is available on the CMS Page and CMS Block glossary editors in the Backoffice.
                        type: boolean
                        default_value: 'false'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                - key: system_prompts
                  name: System Prompts
                  description: System prompt configuration for Smart CMS content generation.
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: system_prompt
                        name: Smart CMS System Prompt
                        description: System prompt that instructs the AI how to generate and edit CMS glossary title and content.
                        type: text
                        default_value: '
                            You are a CMS content authoring assistant for a Spryker Backoffice.
                            ALWAYS call the "get_content_items" tool at the start of every request, before generating any content, to retrieve the list of existing content items. Do this on every request without exception, even if the request does not obviously mention content items - it tells you which Banners, Product Sets, File Lists and Navigations exist and their keys and templates. Never skip this tool call and never assume which content items exist.
                            You generate and edit CMS glossary content (titles and rich HTML content) for the page or block the editor is working on.
                            You receive the editor''s instruction, the current content of every placeholder across every locale, and read-only metadata about the page or block (name, template, URL slug, SEO meta, validity, stores) as context. Never change that metadata.
                            Use "entityContext.templateName" to understand which page or block template the content is rendered in, and produce content whose structure, sections and length suit that template.
                            Generate content for every requested placeholder and locale. Preserve the original locale of each translation - write German content for de_DE, English content for en_US, and so on.
                            Return clean, valid HTML suitable for a WYSIWYG editor. Keep any existing, valid CMS content widget calls and content item calls intact unless the instruction asks to change them.
                            There are two distinct kinds of embeddable CMS markup; never mix up their syntax:
                            1) Content WIDGETS, listed in the request data under "availableContentWidgets". Embed these using the EXACT Twig function name and usage syntax provided for that widget. These functions take an ARRAY argument, not a single key, and an optional second template argument - for example {{ product([''sku1'', ''sku2'']) }} or {{ product([''sku1''], ''default'') }}, and {{ cms_block([''Block Name'']) }} or {{ cms_block([''Block Name''], ''default'') }}. Only use widget functions that appear in "availableContentWidgets", copy the array signature shown in their usage syntax exactly, and never substitute placeholder tokens into a widget call.
                            2) Content ITEMS, returned by the "get_content_items" tool (Banner, Product Set, File List, Navigation, etc.). Each returned item has a real "key", a list of "availableTemplates", and a "twigFunctionTemplate" containing the literal placeholder tokens %KEY% and %TEMPLATE% (for example {{ content_banner(''%KEY%'', ''%TEMPLATE%'') }}). To embed an item, take its twigFunctionTemplate and replace %KEY% with that item''s real key and %TEMPLATE% with one of its availableTemplates - for example {{ content_banner(''the-real-key'', ''a-listed-template'') }}. These calls take a single quoted string key plus a quoted template, NOT an array. Only reference content item keys returned by the tool - never invent or guess a key, and never leave the %KEY% or %TEMPLATE% tokens unreplaced. If the tool returns no suitable item, generate plain HTML instead.
                            You cannot create images. Never embed <img> tags, base64 data URIs or invented image URLs. If the editor asks for a visual, either reuse an existing image-related CMS content widget or content item if one is available, or insert a short [IMAGE: brief description] note describing what the editor should add manually.
                            Be concise and professional. Always provide a short explanation of what you generated or changed.
                            '
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
          - key: quick_order
            name: Quick Order
            description: Quick order configuration.
            enabled: false
            order: 0
            groups:
                - key: visual_add_to_cart
                  name: Visual add to cart
                  description: Controls how the AI processes uploaded images to recognise products for quick order.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                      - store
                  settings:
                      - key: enabled
                        name: Enabled
                        description: Enables or disables the image to cart feature for quick order.
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                - key: system_prompts
                  name: System Prompts
                  description: Prompt configuration for the Quick Order Image-to-Cart feature.
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: image_recognition_prompt
                        name: Image Recognition Prompt
                        description: Prompt used to recognise products from an uploaded image for quick order. Keep the %s placeholder for the current store locale.
                        type: text
                        default_value: 'I want you to support me for a quick add to cart functionality by identifying from a picture what the customer want to buy and provide me only with a JSON containing a list of products and quantities. If the user asks for a product to be compatible with any other product include it as part of each product name. Important! Your response must only contain the valid JSON object without any special or additional chars. Important! The image may contain SKU instead of product name, so use SKU as product name if it is recognized. Important! Current store locale is %s — translate recognized product names into the corresponding store locale if necessary.'
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
          - key: search_by_image
            name: Search by Image
            description: Search by Image configuration.
            enabled: false
            order: 0
            groups:
                - key: search_by_image
                  name: Search by Image
                  description: Controls the Search by Image feature availability and redirect behaviour.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                  settings:
                      - key: enabled
                        name: Enable Search by Image
                        description: Enable or disable the Search by Image feature on the storefront.
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                      - key: redirect_type
                        name: Redirect type
                        description: Controls where customers are sent after a search by image.
                        type: radio
                        default_value: search_results
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                        options:
                            - value: search_results
                              label: Search results
                              description: 'Redirect to the catalog search results page for the identified search term.'
                            - value: first_product
                              label: First result product detail page
                              description: 'Redirect directly to the product detail page of the first matching result.'
                - key: system_prompts
                  name: System Prompts
                  description: Prompt configuration for the Search by Image feature.
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: search_term_prompt
                        name: Search Term Prompt
                        description: Prompt used to identify the main product in an uploaded image and return a relevant search term.
                        type: text
                        default_value: 'Identify the main product in this image and respond with only the most relevant product search term. One to three words maximum.'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
          - key: smart_pim
            name: Smart PIM
            description: Smart PIM AI prompt configuration.
            enabled: false
            order: 3
            groups:
                - key: system_prompts
                  name: System Prompts
                  description: Prompt configuration for Smart PIM AI features.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                  settings:
                      - key: content_improver_prompt
                        name: Content Improver Prompt
                        description: Prompt used to improve product content. Keep the %s placeholder for the text to improve.
                        type: text
                        default_value: "Improve the following text for an e-commerce product by enhancing clarity, grammar, structure, and readability while maintaining the original meaning and tone.\n        Make it more professional and engaging for potential customers.\n        Text to improve: %s"
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: translation_prompt
                        name: Translation Prompt
                        description: Prompt used to translate product content. Keep the %s placeholders for the text, source locale, and target locale(s).
                        type: text
                        default_value: "Support me in translating the following text `%s` from %s to %s locale(s) for an online shop, ensuring native speaker fluency.\n        Generate accurate and contextually fitting translations to enhance the user experience.\n        The texts to be translated may contain URLs, URL paths, HTML, unicode characters or some word enclosed by the character \"%%\", please don't translate them."
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: translation_collection_prompt
                        name: Translation Collection Prompt
                        description: Prompt used to translate product content into a collection of locales in a single request. Keep the %s placeholders for the text, source locale, and target locales.
                        type: text
                        default_value: "Support me in translating the following text `%s` from %s to each of the following locales: %s, for an online shop, ensuring native speaker fluency.\n        Generate accurate and contextually fitting translations for each locale to enhance the user experience. Return one translation item per requested locale.\n        The texts to be translated may contain URLs, URL paths, HTML, unicode characters or some word enclosed by the character \"%%\", please don't translate them."
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: category_suggestion_prompt
                        name: Category Suggestion Prompt
                        description: Prompt used to suggest product categories. Keep the %s placeholders for the product name, description, and existing categories.
                        type: text
                        default_value: "Based on the provided product name and description, suggest the most fitting product categories from the existing categories list for optimal placement in an e-commerce store.\n        Product name: %s\n        Product description: %s\n        Existing categories in format {\"categoryName\": \"categoryId\", ...}:\n        %s"
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
                      - key: image_alt_text_prompt
                        name: Image Alt Text Prompt
                        description: Prompt used to generate an HTML alt text for a product image. Keep the %s placeholder for the locale.
                        type: text
                        default_value: 'Describe the most important characteristics of the main object you can identify in the image e.g. manufacturer, model, color, part number or any identification number that help me to define the HTML alt text for best SEO using the language from locale %s.'
                        enabled: true
                        secret: false
                        storefront: false
                        scopes:
                            - global
